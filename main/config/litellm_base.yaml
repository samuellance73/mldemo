# litellm_base.yaml
#
# Static LiteLLM proxy configuration. This file is committed to git.
# It contains only non-secret settings — no API keys.
#
# At startup, the llm_proxy_service reads this file and injects the
# model_list (built from llm_keys.yaml / LLM_KEYS env var) before
# writing the final litellm.yaml.
#
# Edit this file to change routing strategy, retry behavior, etc.
# Changes are tracked in git history like any other config.
# ------------------------------------------------------------------------------

router_settings:
  routing_strategy: simple-shuffle  # simple-shuffle | least-busy | latency-based-routing
  num_retries: 5
  retry_after: 1
  allowed_fails: 1      # Cooldown key immediately on first 429/503 failure
  cooldown_time: 300    # Keep rate-limited key out of rotation for 5 minutes

litellm_settings:
  check_provider_endpoint: true
  drop_params: true
  # request_timeout: 120

general_settings: {}
