name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'manifests/state.json'
      - 'llm_keys.yaml.example'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js (To build your React frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      # 3. Install dependencies and compile the React frontend into main/dist/
      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # 4. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 5. Set up the uv package manager
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # 6. Execute Python compilation (Generates main/dist/ package files)
      - name: Compile Project to Bytecode
        run: |
          uv run python main/scripts/build.py --logs 2 --hardener bytecode

      # 7. Generate fallback metadata.json directly inside the build context
      - name: Generate Fallback Metadata
        run: |
          echo '{"node_name": "github-actions"}' > main/dist/metadata.json

      # 8. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 9. Log in to your Docker Hub account securely
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 10. Build the image from main/dist/ and push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: main/dist
          file: main/dist/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sanctuary:latest
            ${{ secrets.DOCKER_USERNAME }}/sanctuary:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max