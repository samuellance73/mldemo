name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Triggers the build automatically on every push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Set up the uv package manager (for lightning-fast dependency resolution)
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # 4. Execute your custom compilation pipeline to generate main/dist/
      - name: Compile Project to Bytecode
        run: |
          uv run python main/scripts/build.py --logs 2 --hardener bytecode

      # 5. Set up Docker Buildx (enables high-speed multi-stage caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Log in to your Docker Hub account securely
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Build the image from main/dist/ and push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: main/dist
          file: main/dist/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sanctuary:latest
            ${{ secrets.DOCKER_USERNAME }}/sanctuary:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max