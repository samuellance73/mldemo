[project]
name = "sanctuary"
version = "0.2.0"
description = "Sanctuary — platform-agnostic AI node orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.3",
    "huggingface-hub>=1.15.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.2.2",
    "python-minifier>=3.2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.48.0",
]

[project.scripts]
cc = "sanctuary.client.cc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctuary"]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[tool.ruff]
builtins = ["harden"]
target-version = "py313"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "dist",
    "__pycache__",
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "RUF"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
