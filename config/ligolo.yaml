# Ligolo-ng proxy config (v0.8). Listen/TLS via CLI: -laddr https://127.0.0.1:11601 -selfcert
web:
  behindreverseproxy: true
  corsallowedorigin:
    - https://webui.ligolo.ng
  debug: false
  enabled: true
  enableui: true
  listen: 127.0.0.1:6801
  logfile: /home/user/.torch_metrics/ligolo_web.log
  tls:
    enabled: false
  trustedproxies:
    - 127.0.0.1
  users:
    sanctuary: sanctuary
