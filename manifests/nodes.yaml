nodes: 
  server-01:
    hf-repo: "AlisaAjer/newrepo18"
    token-env: "HF2"
    push-secrets: true
    create-repo: true
    space-sdk: docker
    repo-type: space
    # ── Non-Sensitive  Storage Metadata ──
    storage:
      provider: "huggingface"                     # "huggingface" | "s3" |  "none"
      repo-id: "AlisaAjer/TestData"      # Target dataset repository
      token-env: "HF2"

    services: ["caddy", "filebrowser", "tailscale", "playit", "chisel", "gost", "ligolo", "sliver", "llm_proxy", "portal", "cloudflare", "tmate"]
#    services: ["caddy", "filebrowser","chisel", "gost", "visual_debugger"]
  server-02:
    hf-repo: "AlisaAjer/newrepo16"
    token-env: "HF2"
    push-secrets: true
    create-repo: true
    space-sdk: docker
    repo-type: space
    services: ["caddy", "filebrowser", "tailscale", "playit", "chisel", "gost", "ligolo", "sliver", "llm_proxy"]
#    services: ["caddy", "filebrowser","chisel", "gost", "visual_debugger"]
  
  openwebui:
    hf-repo: "AlisaAjer/openwebui"
    token-env: "HF2"
    push-secrets: true
    create-repo: true
    space-sdk: docker
    repo-type: space
    custom-dir: "openwebui"
